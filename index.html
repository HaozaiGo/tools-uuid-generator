<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UUID Generator - UUID 批量生成器在线工具</title>
  <meta name="description" content="免费在线 UUID 生成器。支持 UUID v4/v1/v7，批量生成，多种格式输出。浏览器端处理。">
  <meta name="keywords" content="uuid generator, uuid v4, uuid v7, generate uuid online, bulk uuid generator">
  <link rel="canonical" href="https://uuid-generator.vercel.app/">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <div class="header-inner">
        <h1 class="logo">🔑 UUID Generator</h1>
        <p class="tagline">UUID 批量生成 · v4 / v1 / v7 · 多种格式输出</p>
      </div>
    </div>
  </header>

  <main class="main container">
    <div class="card">
      <!-- Controls -->
      <div class="controls-section">
        <div class="control-row">
          <div class="control-group">
            <label for="uuid-version">UUID 版本</label>
            <select id="uuid-version">
              <option value="v4">UUID v4（随机）</option>
              <option value="v7">UUID v7（时间排序）</option>
              <option value="v1">UUID v1（时间戳）</option>
            </select>
          </div>
          <div class="control-group">
            <label for="uuid-count">生成数量</label>
            <div class="count-input-group">
              <input type="range" id="uuid-count-range" min="1" max="1000" value="10">
              <input type="number" id="uuid-count" class="num-input" value="10" min="1" max="10000">
            </div>
          </div>
        </div>

        <div class="control-row">
          <div class="control-group">
            <label>格式选项</label>
            <div class="format-options">
              <label class="checkbox-label">
                <input type="checkbox" id="opt-upper" checked>
                大写
              </label>
              <label class="checkbox-label">
                <input type="checkbox" id="opt-dashes" checked>
                包含连字符
              </label>
              <label class="checkbox-label">
                <input type="checkbox" id="opt-braces">
                花括号 {}
              </label>
              <label class="checkbox-label">
                <input type="checkbox" id="opt-quotes">
                引号 ""
              </label>
              <label class="checkbox-label">
                <input type="checkbox" id="opt-commas">
                逗号分隔
              </label>
            </div>
          </div>
        </div>

        <div class="action-row">
          <button class="btn btn-primary btn-lg" onclick="generateUUIDs()">⚡ 生成</button>
          <button class="btn btn-secondary" onclick="copyAll()">📋 复制全部</button>
          <button class="btn btn-secondary" onclick="downloadAll()">⬇ 下载</button>
          <span id="gen-stats" class="gen-stats"></span>
        </div>
      </div>

      <!-- Output -->
      <div class="output-section">
        <div class="output-header">
          <label>生成的 UUID</label>
          <span id="uuid-count-display" class="count-badge">0</span>
        </div>
        <textarea id="uuid-output" class="uuid-output" readonly placeholder="点击「生成」按钮生成 UUID..." spellcheck="false"></textarea>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>🔑 UUID Generator — 使用 Crypto API 生成安全随机数</p>
      <p class="footer-small">纯前端工具 · 零服务端 · 隐私安全</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
